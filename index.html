<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Видеопрокат">
<meta name="theme-color" content="#120E11">
<meta name="color-scheme" content="dark">
<title>Видеопрокат — кино 1980–2015</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#120E11; --ink:#1A1317; --shell:#2C2327; --shell2:#160F13; --line:#3A2F34;
  --paper:#EEE5D3; --paper2:#DACDB4; --red:#D7402F; --cyan:#54CBD3; --amber:#EFA93B; --muted:#9C8D93;
  --top:calc(env(safe-area-inset-top,0px)); --bot:calc(env(safe-area-inset-bottom,0px));
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--paper); overscroll-behavior-y:none;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.osw{font-family:"Oswald",Impact,"Haettenschweiler",sans-serif}

/* ---------- шапка ---------- */
header{position:sticky;top:0;z-index:40;padding:calc(var(--top) + 9px) 12px 9px;
  background:rgba(18,14,17,.92);-webkit-backdrop-filter:saturate(140%) blur(12px);backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px}
.logo{font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  font-size:19px;line-height:1;margin:0;white-space:nowrap}
.logo b{color:var(--red);font-weight:700}
.grow{flex:1}
.icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border:1px solid var(--line);
  background:transparent;color:var(--muted);border-radius:9px;font-size:16px;cursor:pointer}
.icon:active{background:var(--ink)}
.icon.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.bar2{display:flex;gap:8px;margin-top:8px}
#q{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--paper);
  padding:9px 11px;font-size:16px;outline:none}
#q:focus{border-color:var(--cyan)}
.fbtn{white-space:nowrap;background:var(--ink);border:1px solid var(--line);color:var(--paper);border-radius:9px;
  padding:0 13px;height:40px;font-size:13.5px;cursor:pointer;font-family:"IBM Plex Mono",monospace;letter-spacing:.04em}
.fbtn.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.cnt{display:inline-block;min-width:17px;padding:0 4px;margin-left:5px;border-radius:9px;background:var(--red);
  color:#fff;font-size:11px;line-height:17px;text-align:center}

/* ---------- панель фильтров (сворачивается) ---------- */
#filters{overflow:hidden;max-height:0;transition:max-height .26s ease;border-bottom:1px solid transparent}
#filters.open{max-height:640px;border-bottom-color:var(--line)}
.fin{padding:12px 12px 14px}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;color:var(--muted);
  text-transform:uppercase;display:block;margin:0 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em;background:transparent;color:var(--muted);
  border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer;min-height:34px}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600}
.chip.red.on{background:var(--red);color:#fff;border-color:var(--red)}
.chip.cyan.on{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
.chip.amber.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}
select{width:100%;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:9px;
  padding:10px 11px;font-size:15px;outline:none;font-family:"IBM Plex Mono",monospace}
.frow{display:flex;gap:8px;align-items:center}
.reset{color:var(--red);border-color:rgba(215,64,47,.45)}

/* ---------- статистика ---------- */
.stats{display:flex;gap:16px;padding:11px 12px 0}
.stat b{display:block;font-family:"Oswald",sans-serif;font-size:21px;font-weight:600;line-height:1}
.stat i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

/* ---------- сетка ---------- */
main{padding:12px 12px calc(40px + var(--bot))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px}}
.card{position:relative;border:0;padding:0;background:transparent;text-align:left;cursor:pointer;display:block;width:100%}
.pw{position:relative;width:100%;aspect-ratio:2/3;border-radius:9px;overflow:hidden;background:var(--shell2);
  box-shadow:0 6px 16px rgba(0,0,0,.45)}
.artw{position:absolute;inset:0}
.pw img{width:100%;height:100%;object-fit:cover;display:block}
.card:active .pw{transform:scale(.985)}
.ctitle{font-family:"Oswald",sans-serif;font-weight:500;font-size:13.5px;line-height:1.15;margin:7px 0 2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);display:flex;gap:8px}
.badge{position:absolute;top:7px;right:7px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.b{font-family:"Oswald",sans-serif;font-weight:600;font-size:12px;line-height:1;padding:4px 6px;border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,.5)}
.b.fav{background:var(--red);color:#fff}
.b.rate{background:var(--amber);color:var(--ink)}
.orig{position:absolute;left:6px;bottom:6px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;line-height:1;padding:3px 5px;border-radius:5px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.orig.ours{background:rgba(239,169,59,.92);color:var(--ink);font-weight:600}
.orig.far{background:rgba(14,10,12,.66);color:var(--paper);border:1px solid rgba(255,255,255,.22)}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-13deg);
  font-family:"Oswald",sans-serif;font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(215,64,47,.95);border:2.5px double rgba(215,64,47,.9);border-radius:4px;padding:3px 8px;
  background:rgba(12,8,10,.35);pointer-events:none;white-space:nowrap}
.seen .artw img{filter:brightness(.62) saturate(.75)}

/* запасная «кассета», если постера нет */
.tape{position:absolute;inset:0;background:linear-gradient(168deg,var(--shell),var(--shell2));
  display:flex;flex-direction:column;justify-content:space-between;padding:9%}
.tlabel{background:linear-gradient(175deg,var(--paper),var(--paper2));color:#1B1418;border-radius:2px;padding:7px 8px;
  box-shadow:0 2px 5px rgba(0,0,0,.4)}
.tlabel .tt{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;font-size:12.5px;line-height:1.05;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tlabel .ty{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:#5C4D52;margin-top:4px}
.reels{display:flex;justify-content:space-around;align-items:center;padding:6% 4% 2%}
.reel{width:30%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#3A2E33 0 17%,#120C0F 18% 60%,#2A2126 61% 100%);
  box-shadow:inset 0 0 8px rgba(0,0,0,.9)}
.tnote{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.1em;color:#6E5E63;text-align:center}

/* ---------- список ---------- */
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;gap:11px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(58,47,52,.6);
  background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;color:inherit}
.li .th{width:42px;height:63px;flex:0 0 42px;border-radius:4px;overflow:hidden;background:var(--shell2)}
.li .th img{width:100%;height:100%;object-fit:cover}
.li .ln{font-family:"Oswald",sans-serif;font-weight:500;font-size:15px;line-height:1.15}
.li .lm{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-top:3px}
.li .lr{margin-left:auto;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12px;white-space:nowrap}

/* ---------- нижний лист ---------- */
.ov{position:fixed;inset:0;background:rgba(8,5,7,.72);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:60;display:none}
.ov.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;background:linear-gradient(180deg,#221A1E,#150F13);border-radius:16px 16px 0 0;
  border-top:1px solid var(--line);padding:8px 16px calc(24px + var(--bot))}
@media(min-width:760px){.sheet{left:50%;bottom:auto;top:50%;transform:translate(-50%,-50%);max-width:560px;border-radius:14px;border:1px solid var(--line)}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sh-h{display:flex;gap:14px}
.sh-p{width:96px;flex:0 0 96px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--shell2);position:relative}
.sh-p img{width:100%;height:100%;object-fit:cover}
.sh-t{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;font-size:21px;line-height:1.05;margin:0 0 6px}
.sh-s{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);line-height:1.6}
.big{display:flex;gap:9px;margin:16px 0}
.big button{flex:1;min-height:48px;border-radius:11px;border:1px solid var(--line);background:var(--ink);color:var(--paper);
  font-size:14px;cursor:pointer;font-family:"IBM Plex Mono",monospace;letter-spacing:.03em}
.big button.on-fav{background:var(--red);border-color:var(--red);color:#fff}
.big button.on-seen{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
.stars{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.stars button{aspect-ratio:1;min-height:34px;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:7px;font-family:"IBM Plex Mono",monospace;font-size:12px;cursor:pointer;padding:0}
.stars button.on{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:600}
.g{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:3px 6px;display:inline-block;margin:0 4px 4px 0}
.g.xmas{color:var(--red);border-color:rgba(215,64,47,.5)}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
input[type=url],input[type=text].k,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;
  color:var(--paper);padding:10px 11px;font-size:16px;outline:none;font-family:"IBM Plex Mono",monospace}
textarea{min-height:90px;font-size:12px}
.wide{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--paper);
  font-family:"IBM Plex Mono",monospace;font-size:13.5px;cursor:pointer;margin-top:8px}
.wide.acc{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600}
.saga{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.saga::-webkit-scrollbar{display:none}
.sg{flex:0 0 72px;border:0;background:transparent;padding:0;cursor:pointer;color:inherit}
.sgp{position:relative;width:72px;height:108px;border-radius:7px;overflow:hidden;background:var(--shell2);
  border:2px solid transparent;display:grid;place-items:center}
.sgp img{width:100%;height:100%;object-fit:cover}
.sg.cur .sgp{border-color:var(--amber)}
.sgn{position:absolute;left:4px;top:4px;background:var(--paper);color:var(--ink);font-family:"Oswald",sans-serif;
  font-weight:600;font-size:11px;line-height:1;padding:3px 6px;border-radius:5px}
.sg.cur .sgn{background:var(--amber)}
.sgv{position:absolute;right:4px;top:4px;background:var(--cyan);color:var(--ink);font-size:10px;line-height:1;
  padding:3px 4px;border-radius:5px;font-weight:700}
.sgr{position:absolute;right:4px;bottom:4px;background:var(--amber);color:var(--ink);font-family:"Oswald",sans-serif;
  font-weight:600;font-size:11px;line-height:1;padding:3px 5px;border-radius:5px}
.sgy{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.sgt{font-size:10.5px;line-height:1.2;color:var(--muted);margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b.mate{background:var(--paper);color:var(--ink);opacity:.85}
#btn-set.pend::after{content:'';position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red)}
#btn-set{position:relative}
.warn{border:1px solid rgba(215,64,47,.55);background:rgba(215,64,47,.09);border-radius:10px;padding:11px 13px;margin-bottom:14px;font-size:13px;line-height:1.5;color:var(--paper)}
.warn b{color:var(--red)}
.warn.info{border-color:rgba(84,203,211,.5);background:rgba(84,203,211,.08)}
.warn.info b{color:var(--cyan)}
.empty{text-align:center;padding:56px 18px;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:13px}
.ok{color:var(--cyan)} .bad{color:var(--red)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 class="logo">Видео<b>прокат</b></h1>
    <span class="grow"></span>
    <div class="stats" style="padding:0;gap:14px">
      <div class="stat"><b id="s-seen" style="color:var(--cyan)">0</b><i>смотрели</i></div>
      <div class="stat"><b id="s-fav" style="color:var(--red)">0</b><i>избранное</i></div>
      <div class="stat"><b id="s-avg" style="color:var(--amber)">—</b><i>средняя</i></div>
    </div>
    <button class="icon" id="btn-set" aria-label="Настройки">⚙</button>
  </div>
  <div class="bar2">
    <input id="q" type="text" inputmode="search" placeholder="Поиск по названию" autocomplete="off">
    <button class="fbtn" id="btn-f">Фильтры<span class="cnt" id="fcnt" hidden>0</span></button>
    <button class="icon" id="btn-v" aria-label="Вид">☰</button>
  </div>
</header>

<div id="filters">
  <div class="fin">
    <span class="lbl">Годы</span>
    <div class="chips" id="f-dec"></div>
    <span class="lbl">Отметки</span>
    <div class="chips" id="f-st"></div>
    <span class="lbl">Откуда кино</span>
    <div class="chips" id="f-from"></div>
    <span class="lbl">Жанры</span>
    <div class="chips" id="f-gen"></div>
    <span class="lbl">Сортировка</span>
    <select id="f-sort"></select>
    <div class="frow" style="margin-top:12px">
      <button class="chip amber" id="f-pick">под наш вкус</button>
      <button class="chip" id="f-core">СНГ-подборка</button>
      <button class="chip reset" id="f-reset">сбросить всё</button>
      <span class="grow"></span>
      <span class="lbl" style="margin:0" id="f-count"></span>
    </div>
  </div>
</div>

<main><div id="warn" class="warn" hidden></div><div id="load" class="warn info" hidden></div><div id="out"></div></main>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k){
  const db = await idb();
  return new Promise((res, rej) => {
    const q = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
async function idbSet(k, v){
  const db = await idb();
  return new Promise((res, rej) => {
    const q = db.transaction(IDB_STORE, "readwrite").objectStore(IDB_STORE).put(v, k);
    q.onsuccess = () => res(); q.onerror = () => rej(q.error);
  });
}

function buildFilms(){
  const core = RAW.map(([ru,orig,year,genres,cis,kp]) => ({
    id: slug(ru,year), ru, orig, year, genres, cis, kp,
    pop: cis, dec: dec(year), pick: isPick(genres), core: true
  }));
  const seen = new Set();
  core.forEach(f => { seen.add(norm(f.ru)+"|"+f.year); seen.add(norm(f.orig)+"|"+f.year); });

  const extra = [];
  CATALOG.forEach(c => {
    const ru = c[1] || c[2], orig = c[2] || c[1], year = c[3];
    if (!ru || !year) return;
    if (seen.has(norm(ru)+"|"+year) || seen.has(norm(orig)+"|"+year)) return;
    if (seen.has(norm(ru)+"|"+(year-1)) || seen.has(norm(orig)+"|"+(year-1))) return;
    seen.add(norm(ru)+"|"+year); seen.add(norm(orig)+"|"+year);
    const genres = (c[4]||[]).map(g => TG[g]).filter(Boolean);
    extra.push({
      id: "tmdb-" + c[0], ru, orig, year, genres,
      cis: null, kp: c[5] || 0, pop: Math.min(99, Math.round(Math.log10((c[6]||1) + 1) * 40)),
      dec: dec(year), pick: isPick(genres), core: false, path: c[7] || "", lang: c[8] || ""
    });
  });

  FILMS = core.concat(extra);

const queue = []; let active = 0; let pending = 0;
function needPoster(f){
  if (!S.tmdb || f.path || S.poster[f.id] || S.cache[f.id] !== undefined) return;
  if (queue.includes(f.id)) return;
  queue.push(f.id); pump();

function pump(){
  while (active < 3 && queue.length){
    const id = queue.shift(); const f = FILMS.find(x=>x.id===id);
    if (!f || S.cache[f.id] !== undefined) continue;
    active++; pending++;

      if (el && path) el.innerHTML = '<img loading="lazy" alt="" src="https://image.tmdb.org/t/p/w342'+path+'">';
      save();
    }).catch(e => { netFail(e); }).finally(()=>{ active--; pending--; pump(); progress(); });
  }
  progress();
}

async function lookup(f){
  const tryQ = async (q, year, lang) => {
    const url = "https://api.themoviedb.org/3/search/movie?include_adult=false&language=" + lang
      + "&api_key=" + encodeURIComponent(S.tmdb)
      + "&query=" + encodeURIComponent(q) + (year ? "&year=" + year : "");
    const r = await fetch(url);
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    const list = (j.results||[]).filter(x=>x.poster_path);
    if (!list.length) return null;
    const exact = list.find(x => (x.release_date||"").slice(0,4) == f.year)
      || list.find(x => Math.abs(((x.release_date||"0").slice(0,4)|0) - f.year) <= 1);
    return (exact || list[0]).poster_path;
  };
  return (await tryQ(f.orig, f.year, "ru-RU"))
      || (await tryQ(f.orig, f.year, "en-US"))
      || (await tryQ(f.ru,   f.year, "ru-RU"))
      || (await tryQ(f.orig, null,   "en-US"))
      || null;
}

  if (io) io.disconnect();
  if (!S.tmdb) return;

  io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ const f = FILMS.find(x=>x.id===e.target.dataset.p); if (f) needPoster(f); io.unobserve(e.target); }
  }), { rootMargin: "600px 0px" });
  document.querySelectorAll("[data-p]").forEach(el => io.observe(el));
}

  const total = YEAR_TO - YEAR_FROM + 1;
  let fails = 0;

  for (const y of yearsLeft()){
    let pages = 1;
    try {
      const r = await fetch(url(y, 1));
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      take(j);
      pages = Math.min(j.total_pages || 1, 500);
    } catch (e) {
      fails++;
      catStatus('<b>Обрыв связи на ' + y + ' году.</b> Загружено ' + out.size + ' фильмов, продолжу при следующем открытии.', true);
      loading = false;
      return;
    }
    const q = []; for (let pg = 2; pg <= pages; pg++) q.push(pg);
    let done = 0;
    await Promise.all(new Array(6).fill(0).map(async () => {
      while (q.length){
        const pg = q.shift();
        try { const r = await fetch(url(y, pg)); if (!r.ok) throw new Error("x"); take(await r.json()); }
        catch (e) { fails++; }
        if (++done % 8 === 0)
          catStatus('<b>Собираю каталог…</b> ' + y + ' год, страница ' + done + ' из ' + pages + ' · всего ' + out.size + ' фильмов');
      }
    }));

    S.catYears[y] = 1;
    CATALOG = [...out.values()];
    try { await idbSet("catalog", CATALOG); }
    catch (e) {
      catStatus('<span class="bad">Память телефона закончилась на ' + CATALOG.length + ' фильмах. Поднимите порог оценок в настройках и соберите заново.</span>', true);
      loading = false; return;
    }
    save(true);
    buildFilms(); buildFilters(); render();
    const left = yearsLeft().length;
    catStatus('<b>Собираю каталог…</b> готово ' + (total - left) + ' лет из ' + total + ' · ' + CATALOG.length + ' фильмов');
  }

  catStatus('<b>Каталог собран:</b> ' + FILMS.length + ' фильмов за ' + YEAR_FROM + '–' + YEAR_TO
    + (fails ? ', ' + fails + ' страниц не открылось' : '') + '.', true);
  loading = false;
}

let syncMsg = "";
let syncing = false;

async function sbSync(marks, ratings){
  const r = await fetch(SB_URL + "/rest/v1/rpc/vp_sync", {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_room: S.room, p_person: S.person, p_marks: marks, p_ratings: ratings })
  });
  if (!r.ok){
    let t = ""; try { t = (await r.json()).message || ""; } catch(e){}
    throw new Error("HTTP " + r.status + (t ? ": " + t : ""));
  }
  return r.json();
}
function markDirty(id){
  if (!S.room) return;
  S.dirty[id] = 1; save();
  syncNow();
}
function allDirty(){
  new Set(S.fav.concat(S.seen).concat(Object.keys(S.rate))).forEach(id => S.dirty[id] = 1);
  save();
}
async function syncNow(){
  if (!S.room || syncing) return;
  syncing = true;
  const ids = Object.keys(S.dirty);
  try {
    const marks = ids.map(id => ({ film_id: id, fav: S.fav.includes(id), seen: S.seen.includes(id) }));
    const ratings = ids.map(id => ({ film_id: id, rate: S.rate[id] || null }));
    const res = await sbSync(marks, ratings);
    ids.forEach(id => delete S.dirty[id]);
    const nf = new Set(), ns = new Set(), mine = {}, mate = {};
    (res.marks || []).forEach(row => { if (row[1]) nf.add(row[0]); if (row[2]) ns.add(row[0]); });
    (res.ratings || []).forEach(row => {
      if (!row[2]) return;
      if (row[1] === S.person) mine[row[0]] = row[2]; else mate[row[0]] = { p: row[1], r: row[2] };
    });
    Object.keys(S.dirty).forEach(id => {
      S.fav.includes(id) ? nf.add(id) : nf.delete(id);
      S.seen.includes(id) ? ns.add(id) : ns.delete(id);
      if (S.rate[id]) mine[id] = S.rate[id]; else delete mine[id];
    });
    S.fav = [...nf]; S.seen = [...ns]; S.rate = mine; S.mate = mate;
    save(true);
    syncMsg = "синхронизировано в " + new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    render();
  } catch (e) {
    syncMsg = "нет связи с общей полкой — " + e.message;
  } finally {
    syncing = false;
    const el = document.getElementById("ss"); if (el) el.textContent = syncMsg;
    const b = document.getElementById("btn-set");
    if (b) b.classList.toggle("pend", Object.keys(S.dirty).length > 0);
  }
}
function newRoom(){
  const r = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().replace(/-/g, "").slice(0, 16)
          : Math.random().toString(36).slice(2) + Date.now().toString(36);

}

let vKey = "", vCache = null;
function visible(){
  const key = JSON.stringify([F, S.sort, FILMS.length, S.fav.length, S.seen.length, Object.keys(S.rate).length]);
  if (key === vKey && vCache) return vCache;
  const res = computeVisible();
  vKey = key; vCache = res;
  return res;
}
function computeVisible(){
  const n = F.q.trim().toLowerCase();
  const out = FILMS.filter(f => {
    if (n && !(f.ru.toLowerCase().includes(n) || f.orig.toLowerCase().includes(n))) return false;
    if (F.dec.length && !F.dec.includes(f.dec)) return false;
    if (F.gen.length && !f.genres.some(g => F.gen.includes(g))) return false;
    if (F.pick && !f.pick) return false;
    if (F.core && !f.core) return false;
    if (F.from === "cis" && !isCIS(f)) return false;
    if (F.from === "far" && isCIS(f)) return false;
    if (F.st === "fav" && !S.fav.includes(f.id)) return false;
    if (F.st === "seen" && !S.seen.includes(f.id)) return false;
    if (F.st === "unseen" && S.seen.includes(f.id)) return false;
    if (F.st === "rated" && !S.rate[f.id]) return false;
    return true;
  });
  const mine = f => S.rate[f.id] || -1;
  const cmp = { cis:(a,b)=>b.pop-a.pop||b.kp-a.kp, kp:(a,b)=>b.kp-a.kp||b.pop-a.pop,
    mine:(a,b)=>mine(b)-mine(a)||b.pop-a.pop, new:(a,b)=>b.year-a.year||b.pop-a.pop,
    old:(a,b)=>a.year-b.year||b.pop-a.pop, az:(a,b)=>a.ru.localeCompare(b.ru,"ru") }[S.sort];
  return out.sort(cmp);
}

async function diagnose(){
  const out = $("#ks"); const L = []; const put = () => { out.className = "note"; out.innerHTML = L.join("<br>"); };
  L.push("Адрес страницы: " + location.protocol + "//" + (location.host || "—"));
  if (location.protocol === "file:")
    L.push('<span class="bad">Страница открыта как локальный файл. В этом режиме Safari не пускает её в интернет, поэтому постеров не будет. Нужен обычный https-адрес.</span>');
  if (window.self !== window.top)
    L.push('<span class="bad">Страница показана внутри чужого окна (предпросмотр). Такие окна блокируют внешние запросы — откройте файл по своему адресу.</span>');
  put();
  let path = null;
  try {
    const r = await fetch("https://api.themoviedb.org/3/search/movie?query=Home%20Alone&year=1990&api_key=" + encodeURIComponent(S.tmdb));
    if (r.status === 401) L.push('<span class="bad">TMDB не принял ключ (401). Перевыпустите его в Settings → API.</span>');
    else if (r.status === 429) L.push('<span class="bad">TMDB просит подождать (429). Повторите через минуту.</span>');
    else if (!r.ok) L.push('<span class="bad">TMDB ответил ошибкой ' + r.status + '.</span>');
    else {
      const j = await r.json();
      const hit = (j.results || []).filter(x => x.poster_path)[0];
      path = hit ? hit.poster_path : null;
      L.push('<span class="ok">API отвечает, ключ рабочий' + (path ? ", тестовый фильм найден" : "") + '.</span>');
    }
  } catch (e) {
    L.push('<span class="bad">Запрос к TMDB не ушёл: ' + esc(e.message) + '.</span>');
    L.push("Так бывает, если страница открыта как файл, показана в предпросмотре или нет интернета.");
  }
  if (S.room){
    try { await sbSync([], []); L.push('<span class="ok">Общая полка отвечает, код принят.</span>'); }
    catch (e){ L.push('<span class="bad">Общая полка недоступна: ' + esc(e.message) + '</span>'); }
  } else {
    L.push("Общая полка не подключена — отметки живут только на этом телефоне.");
  }
  put();
  if (path) {
    const ok = await new Promise(res => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = "https://image.tmdb.org/t/p/w92" + path; });

              : '<span class="bad">API работает, но сами картинки заблокированы окружением страницы.</span>');
    put();
  }
}

  const id = $("#sheet").dataset.film;
  const gb = e.target.closest("[data-goto]");
  if (gb){ openFilm(gb.dataset.goto); return; }
  const rb = e.target.closest("[data-rate]");
  if (rb && id){
    const n = +rb.dataset.rate;
    if (S.rate[id] === n) delete S.rate[id]; else { S.rate[id] = n; if (!S.seen.includes(id)) S.seen.push(id); }
    save(true); markDirty(id); openFilm(id); render(); return;
  }
  const ab = e.target.closest("[data-act]"); if (!ab) return;
  const act = ab.dataset.act;
  if (act === "close") return closeSheet();
  if (act === "fav" && id){ S.fav = S.fav.includes(id) ? S.fav.filter(x=>x!==id) : S.fav.concat(id); save(true); markDirty(id); openFilm(id); render(); return; }
  if (act === "seen" && id){ S.seen = S.seen.includes(id) ? S.seen.filter(x=>x!==id) : S.seen.concat(id); save(true); markDirty(id); openFilm(id); render(); return; }
  if (act === "setposter" && id){ const v = $("#pu").value.trim(); if (v) S.poster[id] = v; else delete S.poster[id]; save(true); openFilm(id); render(); return; }
  if (act === "delposter" && id){ delete S.poster[id]; save(true); openFilm(id); render(); return; }
  if (act === "savekey"){
    const k = $("#tk").value.trim(); const st = $("#ks");
    st.textContent = "Проверяю…"; st.className = "note";
    try{
      const r = await fetch("https://api.themoviedb.org/3/configuration?api_key=" + encodeURIComponent(k));
      if (!r.ok) throw new Error(r.status === 401 ? "ключ не подошёл" : "ошибка сети " + r.status);
      S.tmdb = k; save(true);
      st.textContent = "Ключ работает. Постеры начнут подгружаться."; st.className = "note ok";
      render(); fetchAll();
    } catch(err){
      st.textContent = "Не получилось: " + err.message + ". Проверьте ключ и интернет.";
      st.className = "note bad";
    }
    return;
  }
  if (act === "newroom"){ document.getElementById("rm").value = newRoom(); return; }
  if (act === "copyroom"){
    try { await navigator.clipboard.writeText(S.room); document.getElementById("ss").textContent = "код скопирован — отправьте его жене"; }
    catch (err) { document.getElementById("ss").textContent = "код: " + S.room; }
    return;
  }
  if (act === "saveroom"){
    const room = document.getElementById("rm").value.trim();
    const person = document.getElementById("pn").value.trim() || "Я";
    if (room && room.length < 8){ document.getElementById("ss").textContent = "код слишком короткий, нужно от 8 символов"; return; }
    S.room = room; S.person = person; save(true);
    document.getElementById("ss").textContent = room ? "подключаюсь…" : "отключено";
    if (room){ allDirty(); await syncNow(); }
    openSettings();
    return;
  }
  if (act === "loadcat"){
    S.votes = +document.getElementById("votes").value; save(true);
    catStatus("Продолжаю…");
    loadCatalog(false);
    return;
  }
  if (act === "recat"){
    S.votes = +document.getElementById("votes").value; save(true);
    catStatus("Собираю заново…");
    loadCatalog(true);
    return;
  }
  if (act === "clearcat"){
    CATALOG = []; S.catYears = {}; save(true);
    try { await idbSet("catalog", []); } catch(e){}
    buildFilms(); buildFilters(); shown = PAGE; render(); openSettings();
    return;
  }
  if (act === "fetchall"){ warned = false; document.getElementById("warn").hidden = true; fetchAll(); return; }
  if (act === "diag"){ diagnose(); return; }
  if (act === "clearcache"){ S.cache = {}; save(true); render(); openSettings(); return; }
  if (act === "backup"){
    const data = JSON.stringify({ fav:S.fav, seen:S.seen, rate:S.rate, poster:S.poster });
    try { await navigator.clipboard.writeText(data); $("#bs").textContent = "Копия в буфере обмена — сохраните её в заметках."; $("#bs").className = "note ok"; }
    catch(err){ $("#rst").value = data; $("#bs").textContent = "Буфер недоступен — копия в поле выше, скопируйте вручную."; $("#bs").className = "note"; }
    return;
  }
  if (act === "restore"){
    try{
      const v = JSON.parse($("#rst").value.trim());
      S.fav = v.fav||[]; S.seen = v.seen||[]; S.rate = v.rate||{}; S.poster = v.poster||{};
      save(true); if (S.room){ allDirty(); syncNow(); } render(); $("#bs").textContent = "Готово: " + S.seen.length + " просмотренных, " + S.fav.length + " в избранном."; $("#bs").className = "note ok";
    } catch(err){ $("#bs").textContent = "Не похоже на резервную копию — вставьте текст целиком."; $("#bs").className = "note bad"; }
    return;
  }
});

$("#btn-set").addEventListener("click", openSettings);
$("#btn-f").addEventListener("click", () => {
  const open = $("#filters").classList.toggle("open");
  $("#btn-f").classList.toggle("on", open);
});
$("#btn-v").addEventListener("click", () => { S.view = S.view === "grid" ? "list" : "grid"; save(true); render(); });
let qt = null;
$("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { F.q = e.target.value; shown = PAGE; render(); }, 140); });

/* ---- чипы фильтров ---- */
function chips(host, items, isOn, onTap, cls){
  host.innerHTML = items.map(([v,l]) => '<button class="chip'+(cls?" "+cls:"")+(isOn(v)?" on":"")+'" data-v="'+esc(v)+'">'+esc(l)+'</button>').join("");
  host.onclick = e => { const b = e.target.closest(".chip"); if (!b) return; onTap(b.dataset.v); shown = PAGE; buildFilters(); render(); };
}
function buildFilters(){
  chips($("#f-dec"), [["80-е","80-е"],["90-е","90-е"],["2000-е","2000-е"],["2010-е","2010-е"]], v => F.dec.includes(v),
    v => F.dec = F.dec.includes(v) ? F.dec.filter(x=>x!==v) : F.dec.concat(v));
  chips($("#f-st"), STATUS, v => F.st === v, v => F.st = v, "cyan");
  chips($("#f-from"), [["","любое"],["cis","СНГ"],["far","зарубежное"]], v => F.from === v, v => F.from = v, "amber");
  chips($("#f-gen"), GENRES.map(g=>[g,g]), v => F.gen.includes(v),
    v => F.gen = F.gen.includes(v) ? F.gen.filter(x=>x!==v) : F.gen.concat(v));
  $("#f-pick").classList.toggle("on", F.pick);
  $("#f-core").classList.toggle("on", F.core);
}
$("#f-pick").addEventListener("click", () => { F.pick = !F.pick; shown = PAGE; buildFilters(); render(); });
$("#f-core").addEventListener("click", () => { F.core = !F.core; shown = PAGE; buildFilters(); render(); });
$("#f-reset").addEventListener("click", () => { F = { q:"", dec:[], gen:[], st:"all", pick:false, core:false, from:"" }; $("#q").value = ""; buildFilters(); render(); });
$("#f-sort").innerHTML = SORTS.map(([k,l]) => '<option value="'+k+'">'+l+'</option>').join("");
$("#f-sort").value = S.sort;
$("#f-sort").addEventListener("change", e => { S.sort = e.target.value; save(true); render(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(true); });
setInterval(() => { if (document.visibilityState === "visible") syncNow(true); }, 20000);

buildFilters();
render();
if (S.room) syncNow(true);
(async () => {
  try {
    const c = await idbGet("catalog");
    if (c && c.length && c.length > CATALOG.length){ CATALOG = c; buildFilms(); buildFilters(); render(); }
    else if (CATALOG.length) await idbSet("catalog", CATALOG);
  } catch(e){}
  if (S.tmdb && yearsLeft().length){
    catStatus("<b>Собираю полный каталог за 1980–2015.</b> Годы добавляются на ходу, листать можно уже сейчас.");
    loadCatalog(false);
  }
})();
if (S.tmdb) fetchAll();

</script>
</body>
</html>
